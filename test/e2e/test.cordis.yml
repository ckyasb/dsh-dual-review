# Overlay for the end-to-end test: one mock route for the agent, and the two
# reviewers in direct mode configured from the R1 / R2 environment variables.
- id: llm-pi-ai
  config:
    providers:
      mock:
        displayName: Mock agent
        api: openai-completions
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        models:
          - { id: main-model, name: main }
- id: agent-default-model
  config:
    provider: mock
    model: main-model
- id: dual-review
  config:
    defaultForNewSessions: true
    reviewers:
      - name: R1
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        model: !!js process.env.R1 ?? ''
      - name: R2
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        model: !!js process.env.R2 ?? ''
