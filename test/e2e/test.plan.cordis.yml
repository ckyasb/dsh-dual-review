# Overlay for the plan-review / completion-check scenarios: the same mock
# provider and direct-mode reviewers as test.cordis.yml, plus the plan-mode
# plugin and the v0.3.0 workflow switches.
- id: llm-pi-ai
  config:
    providers:
      mock:
        displayName: Mock agent
        api: openai-completions
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        models:
          - { id: main-model, name: main }
- id: agent-default-model
  config:
    provider: mock
    model: main-model
- id: plan-mode
  config:
    section: "PLAN_MODE_ACTIVE: investigate read-only, then call exit_plan_mode with your plan."
- id: dual-review
  config:
    defaultForNewSessions: false
    planReview: { enabled: true, autoPlanMode: true, maxRevisions: 2 }
    completionCheck: { enabled: true }
    reviewers:
      - name: R1
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        model: !!js process.env.R1 ?? ''
      - name: R2
        baseURL: !!js "'http://127.0.0.1:' + (process.env.MOCK_PORT ?? '18080') + '/v1'"
        apiKeyEnv: MOCK_API_KEY
        model: !!js process.env.R2 ?? ''
