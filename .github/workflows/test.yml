name: test

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DeepSeek Harness and pnpm
        run: npm install -g @deepseek-ai/dsh@0.2.1-rc.5 pnpm@11.28.5
      - run: npm run check
      - run: npm test
